<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · Rishaan Games</title>
<link rel="stylesheet" href="../style.css">
<style>
  .g2048 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: 320px;
    height: 320px;
    padding: 12px;
  }
  .tile {
    background: #1F2640;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #F2F0E9;
  }
  .tile[data-v="0"] { background: #1F2640; }
  .tile[data-v="2"] { background: #263056; }
  .tile[data-v="4"] { background: #2E3A66; }
  .tile[data-v="8"] { background: #3DE8FF; color: #0B0E1A; }
  .tile[data-v="16"] { background: #26D6E8; color: #0B0E1A; }
  .tile[data-v="32"] { background: #FF3D81; color: #0B0E1A; }
  .tile[data-v="64"] { background: #FF6B9D; color: #0B0E1A; }
  .tile[data-v="128"], .tile[data-v="256"], .tile[data-v="512"] { background: #FFD23D; color: #0B0E1A; }
  .tile[data-v="1024"], .tile[data-v="2048"] { background: #FFF; color: #0B0E1A; }
</style>
</head>
<body>

<div class="game-page">
  <a class="back-link" href="../index.html">&larr; Back to hub</a>
  <h1 class="pixel">2048</h1>
  <div class="score-row">
    <div>Score: <b id="score">0</b></div>
    <div>Best: <b id="best">0</b></div>
  </div>
  <div class="g2048 board" id="board"></div>
  <button class="control" id="restart">New Game</button>
  <p class="hint">Arrow keys to slide tiles. Swipe on mobile.</p>
</div>

<script>
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
let grid, score, best;
best = Number(localStorage.getItem('2048-best') || 0);
bestEl.textContent = best;

function newGrid() {
  grid = Array.from({length:4}, () => Array(4).fill(0));
  score = 0;
  addTile(); addTile();
  render();
}

function addTile() {
  const empty = [];
  grid.forEach((row, r) => row.forEach((v, c) => { if (v === 0) empty.push([r,c]); }));
  if (!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  boardEl.innerHTML = '';
  grid.forEach(row => row.forEach(v => {
    const t = document.createElement('div');
    t.className = 'tile';
    t.dataset.v = v;
    t.textContent = v || '';
    boardEl.appendChild(t);
  }));
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('2048-best', best);
    bestEl.textContent = best;
  }
}

function slideRow(row) {
  const vals = row.filter(v => v !== 0);
  const merged = [];
  let moved = false;
  if (vals.length !== row.filter(v=>v!==0).length) moved = true;
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] === vals[i+1]) {
      merged.push(vals[i] * 2);
      score += vals[i] * 2;
      i++;
      moved = true;
    } else {
      merged.push(vals[i]);
    }
  }
  while (merged.length < 4) merged.push(0);
  if (merged.some((v,i) => v !== row[i])) moved = true;
  return { row: merged, moved };
}

function rotateGrid(g) {
  const n = 4;
  const res = Array.from({length:n}, () => Array(n).fill(0));
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) res[c][n-1-r] = g[r][c];
  return res;
}

function move(dir) {
  // normalize so we always "slide left", using rotation
  let g = grid;
  let rotations = { left:0, up:3, right:2, down:1 }[dir];
  for (let i=0;i<rotations;i++) g = rotateGrid(g);

  let anyMoved = false;
  const result = g.map(row => {
    const { row: newRow, moved } = slideRow(row);
    if (moved) anyMoved = true;
    return newRow;
  });

  let back = result;
  for (let i=0;i<(4-rotations)%4;i++) back = rotateGrid(back);

  if (anyMoved) {
    grid = back;
    addTile();
    render();
  }
}

window.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let touchStartX, touchStartY;
boardEl.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
boardEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
});

document.getElementById('restart').addEventListener('click', newGrid);
newGrid();
</script>

</body>
</html>
