<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake · Rishaan Games</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="game-page">
  <a class="back-link" href="../index.html">&larr; Back to hub</a>
  <h1 class="pixel">SNAKE</h1>
  <div class="score-row">
    <div>Score: <b id="score">0</b></div>
    <div>Best: <b id="best">0</b></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <p class="hint">Arrow keys or WASD to move. Tap the board to (re)start.</p>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const cell = 20;
const cols = canvas.width / cell;
const rows = canvas.height / cell;

let snake, dir, food, score, best, alive, loopId;
best = Number(localStorage.getItem('snake-best') || 0);
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  dir = {x: 1, y: 0};
  score = 0;
  alive = true;
  placeFood();
  document.getElementById('score').textContent = score;
  if (loopId) clearInterval(loopId);
  loopId = setInterval(tick, 110);
}

function placeFood() {
  food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
}

function tick() {
  if (!alive) return;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      document.getElementById('best').textContent = best;
    }
    draw();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#151A2E';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFD23D';
  ctx.fillRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#FF3D81' : '#3DE8FF';
    ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
  });

  if (!alive) {
    ctx.fillStyle = 'rgba(11,14,26,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#F2F0E9';
    ctx.font = '16px Space Grotesk, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game over — tap to retry', canvas.width / 2, canvas.height / 2);
  }
}

window.addEventListener('keydown', e => {
  const map = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0}
  };
  const next = map[e.key];
  if (!next) return;
  if (next.x === -dir.x && next.y === -dir.y) return; // no instant reverse
  dir = next;
});

canvas.addEventListener('click', () => { if (!alive) reset(); });

reset();
</script>

</body>
</html>
